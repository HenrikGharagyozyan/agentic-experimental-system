[project]
name = "experimental-system"
version = "0.1.0"
description = "Multi-agent system for autonomous scientific experiments."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.24",
    "numpy>=2.5.5",
    "openai>=3.60.0",
    "pinecone>=10.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=2.2",
    "pyyaml>=6.0.4",
    "typer>=0.29.3",
]

[project.scripts]
expsys = "experimental_system.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes errors, I: import sorting,
# UP: modern Python syntax, B: common bug patterns (flake8-bugbear).
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "live: calls real external services (OpenRouter, Pinecone); needs keys and EXPSYS_RUN_LIVE=1",
]
